<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wallet Transaction Meta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .form-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2rem;
        }
        .page-title {
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(100,100,255,0.3);
        }
        .page-desc {
            color: rgba(255,255,255,0.55);
        }
        .form-label {
            color: rgba(255,255,255,0.85);
            font-weight: 500;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.12);
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.25);
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .form-select option {
            background: #1a1a3e;
            color: #fff;
        }
        .section-title {
            color: #8ab4f8;
            font-weight: 600;
            margin-top: 1.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 50px;
            padding: 10px 32px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102,126,234,0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            border-radius: 50px;
            padding: 10px 32px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card">
                    <h1 class="page-title">💳 Wallet Transaction Meta</h1>
                    <p class="page-desc">Chuẩn hóa thông tin giao dịch ví</p>

                    <form action="/normalize/wallet-transaction-meta" method="post" class="mt-4">
                        <div class="mb-3">
                            <label for="txId" class="form-label">Tx ID <span style="color:#ff6b6b;">*</span></label>
                            <input type="text" class="form-control" id="txId" name="txId"
                                   value="TX-20260606-001" required>
                        </div>

                        <div class="mb-3">
                            <label for="note" class="form-label">Note</label>
                            <textarea class="form-control" id="note" name="note" rows="2">Purchase of Gold Coin</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="triggeredBy" class="form-label">Triggered By <span style="color:#ff6b6b;">*</span></label>
                            <select class="form-select" id="triggeredBy" name="triggeredBy" required>
                                <option value="">-- Chọn --</option>
                                <option value="system_auto">system_auto</option>
                                <option value="admin">admin</option>
                                <option value="user" selected>user</option>
                                <option value="marketplace">marketplace</option>
                            </select>
                        </div>

                        <h5 class="section-title">📊 Balance Snapshot</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="balanceBefore" class="form-label">Balance Before <span style="color:#ff6b6b;">*</span></label>
                                <input type="number" class="form-control" id="balanceBefore" name="balanceBefore"
                                       value="1000" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="balanceAfter" class="form-label">Balance After <span style="color:#ff6b6b;">*</span></label>
                                <input type="number" class="form-control" id="balanceAfter" name="balanceAfter"
                                       value="800" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="receiptUrl" class="form-label">Receipt URL</label>
                            <input type="url" class="form-control" id="receiptUrl" name="receiptUrl"
                                   value="https://example.com/receipt/tx-20260606-001">
                        </div>

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary">Normalize</button>
                            <a href="/" class="btn btn-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
