<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generic Normalize</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .form-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2rem;
        }
        .page-title {
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(100,100,255,0.3);
        }
        .page-desc {
            color: rgba(255,255,255,0.55);
        }
        .form-label {
            color: rgba(255,255,255,0.85);
            font-weight: 500;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.12);
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.25);
            color: #fff;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .form-control option {
            background: #1a1a3e;
            color: #fff;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 50px;
            padding: 10px 32px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102,126,234,0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            border-radius: 50px;
            padding: 10px 32px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }
        textarea.form-control {
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card">
                    <h1 class="page-title">⚡ Generic Normalize</h1>
                    <p class="page-desc">Nhập collection name và raw data JSON</p>

                    <form action="/normalize/generic" method="post" class="mt-4">
                        <div class="mb-3">
                            <label for="collectionName" class="form-label">Collection Name</label>
                            <input type="text" class="form-control" id="collectionName" name="collectionName"
                                   value="wallet_asset_meta" required>
                        </div>
                        <div class="mb-3">
                            <label for="rawData" class="form-label">Raw Data (JSON)</label>
                            <textarea class="form-control font-monospace" id="rawData" name="rawData" rows="14" required>{
  "asset_id": "ASSET-001",
  "display_name": "Gold Coin",
  "icon_url": "https://example.com/gold.png",
  "description": "A shiny gold coin earned from assessment",
  "earned_at": "2026-06-06T12:00:00Z",
  "source": {
    "ref_type": "assessment",
    "ref_id": "ASM-123"
  },
  "is_tradable": true
}</textarea>
                        </div>
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary">Normalize</button>
                            <a href="/" class="btn btn-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
