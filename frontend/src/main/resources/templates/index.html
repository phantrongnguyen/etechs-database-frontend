<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ETechs Data Normalizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .main-title {
            color: #fff;
            text-shadow: 0 0 30px rgba(100, 100, 255, 0.5);
            font-weight: 700;
        }
        .sub-title {
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
        }
        .card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(100, 200, 255, 0.4);
            box-shadow: 0 12px 40px rgba(100, 100, 255, 0.2);
        }
        .card-title {
            color: #fff;
            font-weight: 600;
        }
        .card-text {
            color: rgba(255,255,255,0.55) !important;
        }
        .card .btn {
            border-radius: 50px;
            padding: 8px 28px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .card .btn-outline-primary {
            border-color: rgba(100, 200, 255, 0.5);
            color: #8ab4f8;
        }
        .card .btn-outline-primary:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5 pt-5">
            <h1 class="display-4 main-title">ETechs Data Normalizer</h1>
            <p class="sub-title">Chọn API endpoint để gửi dữ liệu chuẩn hóa</p>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-lg-3 col-md-6">
                <div class="card h-100 p-3 text-center" onclick="location.href='/normalize/generic'">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center">
                        <div style="font-size:2.5rem; margin-bottom:0.5rem;">⚡</div>
                        <h5 class="card-title">Generic</h5>
                        <p class="card-text">Collection name + JSON thô</p>
                        <a href="/normalize/generic" class="btn btn-outline-primary mt-auto">Chọn</a>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="card h-100 p-3 text-center" onclick="location.href='/normalize/wallet-asset-meta'">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center">
                        <div style="font-size:2.5rem; margin-bottom:0.5rem;">💎</div>
                        <h5 class="card-title">Wallet Asset Meta</h5>
                        <p class="card-text">Chuẩn hóa tài sản số</p>
                        <a href="/normalize/wallet-asset-meta" class="btn btn-outline-primary mt-auto">Chọn</a>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6">
                <div class="card h-100 p-3 text-center" onclick="location.href='/normalize/wallet-transaction-meta'">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center">
                        <div style="font-size:2.5rem; margin-bottom:0.5rem;">💳</div>
                        <h5 class="card-title">Wallet Transaction Meta</h5>
                        <p class="card-text">Chuẩn hóa giao dịch ví</p>
                        <a href="/normalize/wallet-transaction-meta" class="btn btn-outline-primary mt-auto">Chọn</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
