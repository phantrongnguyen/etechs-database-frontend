<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Normalized Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .result-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2rem;
        }
        .page-title {
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(100,100,255,0.3);
        }
        .endpoint-badge {
            display: inline-block;
            background: rgba(102,126,234,0.3);
            color: #8ab4f8;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            border: 1px solid rgba(102,126,234,0.3);
        }
        pre {
            background: rgba(0,0,0,0.35) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: #e4e4e4 !important;
            border-radius: 12px !important;
            font-size: 0.9rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        pre .json-key { color: #ff79c6; }
        pre .json-string { color: #50fa7b; }
        pre .json-number { color: #bd93f9; }
        pre .json-boolean { color: #ffb86c; }
        pre .json-null { color: #f8f8f2; }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            border-radius: 50px;
            padding: 10px 32px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="result-card">
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <h1 class="page-title mb-0">✅ Normalized Result</h1>
                    </div>
                    <span class="endpoint-badge" th:text="'Endpoint: ' + ${endpoint}"></span>

                    <pre class="mt-4 p-4" style="white-space: pre-wrap;" th:text="${result}"></pre>

                    <a href="/" class="btn btn-secondary mt-3">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
